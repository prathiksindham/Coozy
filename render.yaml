# Render Blueprint — deploys the music app as a long-lived Python web service.
# One-click: push this to GitHub, then in Render click "New +" -> "Blueprint"
# and point it at this repo. Render reads $PORT; server.py already honors it.
#
# Secrets are declared with `sync: false`, so Render prompts you to enter them
# in its dashboard (they are NEVER stored in this repo). All are OPTIONAL — the
# core player + YouTube search + lyrics work with none of them set:
#   - GOOGLE_CLIENT_ID ...... enables Google sign-in + saved playlists
#   - GEMINI_API_KEY ........ lyrics AI fallback + persona
#   - GROQ_API_KEY .......... alternative LLM for the persona
#   - LIVEKIT_* ............. voice "listening rooms"
#   - SESSION_SECRET ........ set a random string so logins survive restarts
services:
  - type: web
    name: coozy
    runtime: python
    plan: free
    branch: coozy
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SESSION_SECRET
        generateValue: true      # Render generates a stable random secret
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
